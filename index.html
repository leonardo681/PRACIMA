<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SARA STORE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <p class="brand">SARA STORE</p>
      </div>
    </header>

    <main class="container">
      <nav class="category-nav" aria-label="Categorias de produtos">
        <button class="category-btn" type="button" data-target="camisetas">Camisetas</button>
        <button class="category-btn" type="button" data-target="livros">Livros</button>
        <button class="category-btn" type="button" data-target="biblias">Bíblias</button>
        <button class="category-btn" type="button" data-target="outros">Outros</button>
      </nav>

      <section class="products-section">
        <div id="products"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-content">
        <p>Todos os direitos reservados</p>
        <p>Igreja Sara Biguaçu</p>
      </div>
    </footer>

    <div id="product-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <button class="modal-close" type="button" aria-label="Fechar">×</button>
        <img id="modal-image" src="" alt="Produto ampliado" />
        <div class="modal-body">
          <h3 id="modal-name"></h3>
          <p id="modal-price" class="modal-price"></p>
          <p id="modal-description"></p>
        </div>
      </div>
    </div>

    <button id="scroll-top-btn" class="scroll-top-btn" type="button" aria-label="Voltar ao topo">
      ↑
    </button>

    <script src="script.js"></script>
  </body>
</html>
